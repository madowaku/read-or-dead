name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # 型チェック（ブラウザ側と Worker 側）と Workers 用のビルド
      - run: npm run build
      # GitHub Pages 用（サーバーなし）
      - run: npm run build:pages
